services:
  db:
    image: postgres:17
    environment: &db_environment
      POSTGRES_DB: dorm_maintenance
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      <<: *db_environment
      POSTGRES_HOST: db
      SECRET_KEY: ${SECRET_KEY:?Укажите SECRET_KEY в .env}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yekaterinburg}
      DEVELOPER_CONTACT: ${DEVELOPER_CONTACT:-}
      DEVELOPER_PHONE: ${DEVELOPER_PHONE:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/login', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
